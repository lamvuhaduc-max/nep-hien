<svg width="160" height="160" viewBox="0 0 160 160" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Nếp Hiên — Furniture &amp; Interior</title>

  <!-- Nền vuông bo góc Espresso sang trọng giúp nổi bật trên cả tab sáng và tối -->
  <rect x="4" y="4" width="152" height="152" rx="34" fill="#221610" stroke="#C9A96E" stroke-width="3" stroke-opacity="0.45"/>

  <!-- Biểu tượng Vòm Hiên (Kem sáng #F5EFE0) -->
  <line x1="38" y1="138" x2="122" y2="138" stroke="#F5EFE0" stroke-width="8.5" stroke-linecap="round"/>
  <line x1="48" y1="138" x2="48" y2="90" stroke="#F5EFE0" stroke-width="8.5" stroke-linecap="round"/>
  <line x1="112" y1="138" x2="112" y2="90" stroke="#F5EFE0" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M48 90 Q48 50 80 50 Q112 50 112 90" fill="none" stroke="#F5EFE0" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mái Hiên (Đất nung Terracotta #E07040) -->
  <path d="M30 43 Q80 24 130 43" fill="none" stroke="#E07040" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M30 43 Q25 36 28 27" fill="none" stroke="#E07040" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M130 43 Q135 36 132 27" fill="none" stroke="#E07040" stroke-width="8.5" stroke-linecap="round"/>
  <circle cx="80" cy="18" r="6" fill="#E07040"/>
</svg>
